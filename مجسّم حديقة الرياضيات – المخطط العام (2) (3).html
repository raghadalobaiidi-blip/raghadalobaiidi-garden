<style>
:root{--fg:#1c2a38;--card:rgba(255,255,255,.92);--acc:#e8681a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0;background:#cfe1ef;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--fg);overflow:hidden}
#c{width:100%;height:100%;display:block;touch-action:none}
.vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.25))}
.top{position:fixed;inset-inline:10px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:8px;flex-wrap:wrap}

button{font:inherit;font-size:13px;border:0;border-radius:10px;padding:8px 12px;background:var(--card);color:var(--fg);cursor:pointer}
.strip{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.strip button{white-space:nowrap;flex:none}
.strip b{display:inline-block;background:var(--acc);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;margin-inline-end:6px;font-size:12px}
#card{position:fixed;inset-inline:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);margin-inline:auto;max-width:440px;background:var(--card);border-radius:14px;padding:10px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#card img{width:100%;border-radius:10px;display:block}
#card div{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:600;font-size:14px}
</style>
